name: als-speech-ml
channels:
  - conda-forge
  - defaults
dependencies:
  - pip
  - python=3.11
  - seaborn
  - scipy
  - scikit-learn
  - pysoundfile
  - ipykernel
  - matplotlib
  - numpy
  - librosa
  - jupyterlab
  - pandas
  - openpyxl
  - libgomp
  - pip:
    - --extra-index-url https://download.pytorch.org/whl/cu130
    - torch==2.13.0+cu130
    - transformers==5.20.1
    - huggingface-hub==2.2.0
    - safetensors==0.8.0
